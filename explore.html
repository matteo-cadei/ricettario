<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Tavola">

  <link rel="manifest" href="manifest.json">

  <title>A Tavola — Explore</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .back {
      justify-self: start;
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .logo {
      justify-self: center;
      font-size: 20px;
      font-weight: 700;
    }

    .language-switch {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }

    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .search-area {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px auto;
      gap: 8px;
      margin-bottom: 26px;
    }

    input,
    select,
    button {
      font: inherit;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 11px 12px;
    }

    button {
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .search-button {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .status {
      margin: 0 0 16px;
      font-size: 13px;
      color: #777;
    }


    .explore-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .explore-tab {
      background: transparent;
      border: 1px solid #d6d2c9;
      color: #666;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .explore-tab.active {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .recipe-card {
      position: relative;
    }

    .favorite-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.94);
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favorite-btn.active {
      color: #b73a3a;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .recipe-card {
      overflow: hidden;
      border: 1px solid #dedbd3;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .recipe-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
    }

    .recipe-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eceae4;
    }

    .recipe-card-content {
      padding: 13px 14px 15px;
    }

    .recipe-card h2 {
      margin: 0 0 7px;
      font-size: 16px;
      line-height: 1.25;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: #777;
    }

    .tag {
      border: 1px solid #e2dfd7;
      border-radius: 999px;
      padding: 4px 7px;
      background: #faf9f6;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.4);
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      position: relative;
      width: min(900px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 14px;
      background: #f7f6f2;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      font-size: 22px;
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 390px;
      object-fit: cover;
      background: #eceae4;
    }

    .detail-body {
      padding: 24px;
    }

    .detail-body h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 24px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 32px;
    }

    .detail-grid h3 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .ingredients {
      margin: 0;
      padding-left: 19px;
      line-height: 1.65;
      font-size: 14px;
    }

    .instructions {
      white-space: pre-line;
      line-height: 1.65;
      font-size: 14px;
    }

    .source-link {
      display: inline-block;
      margin-top: 20px;
      color: #1f1f1f;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .recipe-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      .logo {
        font-size: 18px;
      }

      main {
        padding: 22px 16px 50px;
      }

      .top {
        align-items: flex-start;
      }

      h1 {
        font-size: 26px;
      }

      .search-area {
        grid-template-columns: 1fr;
      }

      .recipe-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .recipe-card-content {
        padding: 10px 10px 12px;
      }

      .recipe-card h2 {
        font-size: 14px;
      }

      .recipe-meta {
        font-size: 11px;
      }

      .modal {
        padding: 10px;
      }

      .detail-body {
        padding: 18px;
      }

      .detail-body h2 {
        font-size: 23px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <a
    class="back"
    href="index.html"
    data-i18n="back">
    ← Ricette
  </a>

  <div
    class="logo"
    data-i18n="logo">
    A Tavola
  </div>

  <div class="language-switch">
    <button
      class="lang-btn"
      data-lang="it">
      IT
    </button>

    <span>|</span>

    <button
      class="lang-btn"
      data-lang="en">
      EN
    </button>
  </div>
</header>

<main>

  <div class="top">
    <div>
      <h1>Explore</h1>

      <p
        class="subtitle"
        data-i18n="subtitle">
        Scopri nuove ricette da aggiungere alla tua settimana.
      </p>
    </div>
  </div>

  <div class="search-area">

    <input
      id="search-input"
      type="search"
      placeholder="Cerca una ricetta..."
      autocomplete="off">

    <select id="category-select">
      <option value="">
        Tutte le categorie
      </option>
    </select>

    <button
      id="search-button"
      class="search-button"
      type="button"
      data-i18n="search">
      Cerca
    </button>

  </div>


  <div class="explore-tabs">
    <button
      class="explore-tab active"
      type="button"
      data-view="all"
      data-i18n="all">
      All
    </button>

    <button
      class="explore-tab"
      type="button"
      data-view="favorites"
      data-i18n="favorites">
      Favorites
    </button>
  </div>

  <p
    id="status"
    class="status">
  </p>

  <div
    id="recipe-grid"
    class="recipe-grid">
  </div>

</main>

<div
  id="recipe-modal"
  class="modal hidden">

  <div class="modal-content">

    <button
      id="modal-close"
      class="modal-close"
      type="button">
      ×
    </button>

    <div id="recipe-detail"></div>

  </div>

</div>

<script>
  const API_BASE =
    "https://www.themealdb.com/api/json/v1/1";

  const translations = {
    it: {
      logo: "A Tavola",
      back: "← Ricette",
      subtitle:
        "Scopri nuove ricette da aggiungere alla tua settimana.",
      search: "Cerca",
      searchPlaceholder:
        "Cerca una ricetta...",
      allCategories:
        "Tutte le categorie",
      loading:
        "Caricamento...",
      noResults:
        "Nessuna ricetta trovata.",
      error:
        "Errore nel caricamento delle ricette.",
      ingredients:
        "Ingredienti",
      instructions:
        "Preparazione",
      source:
        "Fonte",
      initial:
        "Ricette da scoprire",
      all: "Tutte",
      favorites: "Preferiti",
      noFavorites: "Non hai ancora ricette preferite."
    },

    en: {
      logo: "Our Table",
      back: "← Recipes",
      subtitle:
        "Discover new recipes to add to your week.",
      search: "Search",
      searchPlaceholder:
        "Search for a recipe...",
      allCategories:
        "All categories",
      loading:
        "Loading...",
      noResults:
        "No recipes found.",
      error:
        "Error loading recipes.",
      ingredients:
        "Ingredients",
      instructions:
        "Instructions",
      source:
        "Source",
      initial:
        "Recipes to discover",
      all: "All",
      favorites: "Favorites",
      noFavorites: "You don’t have any favorite recipes yet."
    }
  };

  function getLanguage() {
    const params =
      new URLSearchParams(
        window.location.search
      );

    const urlLang =
      params.get("lang");

    if (
      urlLang === "it" ||
      urlLang === "en"
    ) {
      localStorage.setItem(
        "language",
        urlLang
      );

      return urlLang;
    }

    return (
      localStorage.getItem("language") ||
      "it"
    );
  }

  let currentLanguage =
    getLanguage();

  let currentView = "all";

  function getFavoriteIds() {
    try {
      return JSON.parse(
        localStorage.getItem(
          "exploreFavorites"
        ) || "[]"
      );
    } catch {
      return [];
    }
  }

  function isFavorite(id) {
    return getFavoriteIds().includes(
      String(id)
    );
  }

  function toggleFavorite(id) {
    const favoriteIds =
      getFavoriteIds();

    const recipeId =
      String(id);

    const exists =
      favoriteIds.includes(
        recipeId
      );

    const updated =
      exists
        ? favoriteIds.filter(
            item =>
              item !== recipeId
          )
        : [
            ...favoriteIds,
            recipeId
          ];

    localStorage.setItem(
      "exploreFavorites",
      JSON.stringify(updated)
    );

    return !exists;
  }

  function setView(view) {
    currentView = view;

    document
      .querySelectorAll(
        ".explore-tab"
      )
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.view ===
            view
        );
      });

    if (
      view === "favorites"
    ) {
      loadFavorites();
    } else {
      searchMeals();
    }
  }


  function setLanguage(lang) {
    currentLanguage = lang;

    localStorage.setItem(
      "language",
      lang
    );

    document.documentElement.lang =
      lang;

    document
      .querySelectorAll("[data-i18n]")
      .forEach(element => {
        const key =
          element.dataset.i18n;

        if (
          translations[lang][key]
        ) {
          element.textContent =
            translations[lang][key];
        }
      });

    document
      .querySelectorAll(".lang-btn")
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === lang
        );
      });

    document
      .getElementById("search-input")
      .placeholder =
        translations[lang]
          .searchPlaceholder;

    const firstOption =
      document.querySelector(
        '#category-select option[value=""]'
      );

    if (firstOption) {
      firstOption.textContent =
        translations[lang]
          .allCategories;
    }
  }

  document
    .querySelectorAll(".lang-btn")
    .forEach(button => {
      button.addEventListener(
        "click",
        () => {
          const lang =
            button.dataset.lang;

          const params =
            new URLSearchParams(
              window.location.search
            );

          params.set(
            "lang",
            lang
          );

          window.location.search =
            params.toString();
        }
      );
    });

  function escapeHTML(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function loadCategories() {
    try {
      const response =
        await fetch(
          `${API_BASE}/list.php?c=list`
        );

      const data =
        await response.json();

      const select =
        document.getElementById(
          "category-select"
        );

      (data.meals || [])
        .forEach(item => {
          const option =
            document.createElement(
              "option"
            );

          option.value =
            item.strCategory;

          option.textContent =
            item.strCategory;

          select.appendChild(
            option
          );
        });

    } catch (error) {
      console.error(
        "Category error:",
        error
      );
    }
  }

  function renderMeals(meals) {
    const grid =
      document.getElementById(
        "recipe-grid"
      );

    grid.innerHTML = "";

    if (
      !meals ||
      meals.length === 0
    ) {
      document.getElementById(
        "status"
      ).textContent =
        translations[
          currentLanguage
        ].noResults;

      return;
    }

    document.getElementById(
      "status"
    ).textContent =
      `${meals.length} ${
        meals.length === 1
          ? "recipe"
          : "recipes"
      }`;

    meals.forEach(meal => {
      const card =
        document.createElement(
          "article"
        );

      card.className =
        "recipe-card";

      const favorite =
        isFavorite(
          meal.idMeal
        );

      card.innerHTML = `
        <button
          class="favorite-btn ${
            favorite
              ? "active"
              : ""
          }"
          type="button"
          aria-label="Favorite"
          title="Favorite">
          ${
            favorite
              ? "♥"
              : "♡"
          }
        </button>

        <img
          src="${escapeHTML(
            meal.strMealThumb
          )}/medium"
          alt="${escapeHTML(
            meal.strMeal
          )}"
          loading="lazy"
        >

        <div class="recipe-card-content">
          <h2>
            ${escapeHTML(
              meal.strMeal
            )}
          </h2>

          <div class="recipe-meta">
            ${
              meal.strCategory
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      meal.strCategory
                    )}
                  </span>
                `
                : ""
            }

            ${
              meal.strArea
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      meal.strArea
                    )}
                  </span>
                `
                : ""
            }
          </div>
        </div>
      `;

      const favoriteButton =
        card.querySelector(
          ".favorite-btn"
        );

      favoriteButton
        .addEventListener(
          "click",
          event => {
            event.stopPropagation();

            const active =
              toggleFavorite(
                meal.idMeal
              );

            favoriteButton
              .classList.toggle(
                "active",
                active
              );

            favoriteButton
              .textContent =
                active
                  ? "♥"
                  : "♡";

            if (
              currentView ===
              "favorites" &&
              !active
            ) {
              card.remove();

              if (
                document
                  .querySelectorAll(
                    ".recipe-card"
                  ).length === 0
              ) {
                document
                  .getElementById(
                    "status"
                  )
                  .textContent =
                    translations[
                      currentLanguage
                    ].noFavorites;
              }
            }
          }
        );

      card.addEventListener(
        "click",
        () => {
          openRecipe(
            meal.idMeal
          );
        }
      );

      grid.appendChild(
        card
      );
    });
  }

  async function searchMeals() {
    currentView = "all";

    document
      .querySelectorAll(
        ".explore-tab"
      )
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.view ===
            "all"
        );
      });

    const query =
      document
        .getElementById(
          "search-input"
        )
        .value
        .trim();

    const category =
      document
        .getElementById(
          "category-select"
        )
        .value;

    const status =
      document.getElementById(
        "status"
      );

    status.textContent =
      translations[
        currentLanguage
      ].loading;

    try {
      let url;

      if (query) {
        url =
          `${API_BASE}/search.php?s=` +
          encodeURIComponent(query);

      } else if (category) {
        url =
          `${API_BASE}/filter.php?c=` +
          encodeURIComponent(category);

      } else {
        await loadDiscoverMeals();
        return;
      }

      const response =
        await fetch(url);

      const data =
        await response.json();

      let meals =
        data.meals || [];

      /*
        Se abbiamo cercato per nome e
        selezionato anche una categoria,
        filtriamo localmente.
      */
      if (
        query &&
        category
      ) {
        meals =
          meals.filter(
            meal =>
              meal.strCategory ===
              category
          );
      }

      renderMeals(meals);

    } catch (error) {
      console.error(error);

      status.textContent =
        translations[
          currentLanguage
        ].error;
    }
  }

  async function loadDiscoverMeals() {
    const status =
      document.getElementById(
        "status"
      );

    status.textContent =
      translations[
        currentLanguage
      ].loading;

    try {
      /*
        La versione gratuita restituisce
        una ricetta casuale per richiesta.
        Ne carichiamo 8 in parallelo.
      */
      const requests =
        Array.from(
          { length: 8 },
          () =>
            fetch(
              `${API_BASE}/random.php`
            )
              .then(response =>
                response.json()
              )
        );

      const results =
        await Promise.all(
          requests
        );

      const meals =
        results
          .map(
            result =>
              result.meals?.[0]
          )
          .filter(Boolean);

      const uniqueMeals =
        Array.from(
          new Map(
            meals.map(
              meal => [
                meal.idMeal,
                meal
              ]
            )
          ).values()
        );

      renderMeals(
        uniqueMeals
      );

      status.textContent =
        translations[
          currentLanguage
        ].initial;

    } catch (error) {
      console.error(error);

      status.textContent =
        translations[
          currentLanguage
        ].error;
    }
  }

  function getIngredients(meal) {
    const ingredients = [];

    for (
      let i = 1;
      i <= 20;
      i++
    ) {
      const ingredient =
        meal[
          `strIngredient${i}`
        ]?.trim();

      const measure =
        meal[
          `strMeasure${i}`
        ]?.trim();

      if (ingredient) {
        ingredients.push({
          ingredient,
          measure:
            measure || ""
        });
      }
    }

    return ingredients;
  }


  async function loadFavorites() {
    const status =
      document.getElementById(
        "status"
      );

    const favoriteIds =
      getFavoriteIds();

    if (
      favoriteIds.length === 0
    ) {
      document.getElementById(
        "recipe-grid"
      ).innerHTML = "";

      status.textContent =
        translations[
          currentLanguage
        ].noFavorites;

      return;
    }

    status.textContent =
      translations[
        currentLanguage
      ].loading;

    try {
      const requests =
        favoriteIds.map(
          id =>
            fetch(
              `${API_BASE}/lookup.php?i=` +
              encodeURIComponent(id)
            )
              .then(response =>
                response.json()
              )
        );

      const results =
        await Promise.all(
          requests
        );

      const meals =
        results
          .map(
            result =>
              result.meals?.[0]
          )
          .filter(Boolean);

      renderMeals(meals);

    } catch (error) {
      console.error(error);

      status.textContent =
        translations[
          currentLanguage
        ].error;
    }
  }

  async function openRecipe(id) {
    const modal =
      document.getElementById(
        "recipe-modal"
      );

    const detail =
      document.getElementById(
        "recipe-detail"
      );

    modal.classList.remove(
      "hidden"
    );

    detail.innerHTML = `
      <div class="detail-body">
        ${
          translations[
            currentLanguage
          ].loading
        }
      </div>
    `;

    try {
      const response =
        await fetch(
          `${API_BASE}/lookup.php?i=` +
          encodeURIComponent(id)
        );

      const data =
        await response.json();

      const meal =
        data.meals?.[0];

      if (!meal) {
        throw new Error(
          "Recipe not found"
        );
      }

      const ingredients =
        getIngredients(meal);

      detail.innerHTML = `
        <img
          class="detail-image"
          src="${escapeHTML(
            meal.strMealThumb
          )}/large"
          alt="${escapeHTML(
            meal.strMeal
          )}"
        >

        <div class="detail-body">

          <h2>
            ${escapeHTML(
              meal.strMeal
            )}
          </h2>

          <div class="detail-meta">
            ${
              meal.strCategory
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      meal.strCategory
                    )}
                  </span>
                `
                : ""
            }

            ${
              meal.strArea
                ? `
                  <span class="tag">
                    ${escapeHTML(
                      meal.strArea
                    )}
                  </span>
                `
                : ""
            }
          </div>

          <div class="detail-grid">

            <section>
              <h3>
                ${
                  translations[
                    currentLanguage
                  ].ingredients
                }
              </h3>

              <ul class="ingredients">
                ${ingredients
                  .map(
                    item => `
                      <li>
                        ${
                          escapeHTML(
                            item.measure
                          )
                        }
                        ${
                          escapeHTML(
                            item.ingredient
                          )
                        }
                      </li>
                    `
                  )
                  .join("")}
              </ul>
            </section>

            <section>
              <h3>
                ${
                  translations[
                    currentLanguage
                  ].instructions
                }
              </h3>

              <div class="instructions">
                ${escapeHTML(
                  meal.strInstructions
                )}
              </div>

              ${
                meal.strSource
                  ? `
                    <a
                      class="source-link"
                      href="${escapeHTML(
                        meal.strSource
                      )}"
                      target="_blank"
                      rel="noopener noreferrer">
                      ${
                        translations[
                          currentLanguage
                        ].source
                      } ↗
                    </a>
                  `
                  : ""
              }
            </section>

          </div>
        </div>
      `;

    } catch (error) {
      console.error(error);

      detail.innerHTML = `
        <div class="detail-body">
          ${
            translations[
              currentLanguage
            ].error
          }
        </div>
      `;
    }
  }


  document
    .querySelectorAll(
      ".explore-tab"
    )
    .forEach(button => {
      button.addEventListener(
        "click",
        () => {
          setView(
            button.dataset.view
          );
        }
      );
    });

  document
    .getElementById(
      "search-button"
    )
    .addEventListener(
      "click",
      searchMeals
    );

  document
    .getElementById(
      "search-input"
    )
    .addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter"
        ) {
          searchMeals();
        }
      }
    );

  document
    .getElementById(
      "category-select"
    )
    .addEventListener(
      "change",
      searchMeals
    );

  document
    .getElementById(
      "modal-close"
    )
    .addEventListener(
      "click",
      () => {
        document
          .getElementById(
            "recipe-modal"
          )
          .classList.add(
            "hidden"
          );
      }
    );

  document
    .getElementById(
      "recipe-modal"
    )
    .addEventListener(
      "click",
      event => {
        if (
          event.target.id ===
          "recipe-modal"
        ) {
          event.currentTarget
            .classList.add(
              "hidden"
            );
        }
      }
    );

  setLanguage(
    currentLanguage
  );

  loadCategories();
  loadDiscoverMeals();
</script>

</body>
</html>
