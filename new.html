<!DOCTYPE html>
<html lang="it">
<script defer src="https://umami-omega-ochre-70.vercel.app/script.js" data-website-id="4356a40f-3a0d-4917-aaaf-c462703ec9fa"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Tavola">

  <link rel="manifest" href="manifest.json">
  
  <title>Aggiungi ricetta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
    }

    .back {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    
    .language-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    
    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }
    
    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.5;
    }

    #ingredients {
      min-height: 180px;
    }

    #instructions {
      min-height: 220px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .save {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: 1fr 110px 120px 42px;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .ingredient-row input,
    .ingredient-row select {
      width: 100%;
    }
    
    .remove-ingredient {
      padding: 8px;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 22px 16px 50px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .ingredient-row {
      grid-template-columns: 1fr 80px 90px 42px;
      }
      
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="back" data-i18n="back">← Ricette</a>

  <div class="language-switch">
    <button type="button" class="lang-btn" data-lang="it">IT</button>
    <span>|</span>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main>

  <h1 data-i18n="pageTitle">Aggiungi ricetta</h1>

  <form>

    <div class="form-grid">

      <div class="field full">
        <label for="title" data-i18n="title">Titolo</label>
        <input id="title" type="text" placeholder="Es. Maiale alle prugne">
      </div>

      <div class="field">
        <label for="category" data-i18n="category">Categoria</label>
        <select id="category">
          <option>Primi</option>
          <option>Secondi</option>
          <option>Contorni</option>
          <option>Dolci</option>
          <option>Altro</option>
        </select>
      </div>

      <div class="field">
        <label for="servings" data-i18n="servings">Porzioni</label>
        <input id="servings" type="number" min="1" placeholder="4">
      </div>

      <div class="field">
        <label for="time" data-i18n="time">Tempo</label>
        <input id="time" type="text" placeholder="45 min">
      </div>

      <div class="field">
        <label for="made_by" data-i18n="madeBy">Fatto da</label>
        <input id="made_by" type="text" placeholder="Es. Matteo">
      </div>

      <div class="field">
        <label for="image" data-i18n="image">Immagine</label>
        <input id="image" type="file" accept="image/*">
      </div>

      <div class="field full">
        <label data-i18n="ingredients">Ingredienti</label>
      
        <div id="ingredients-list"></div>
      
        <button type="button" id="add-ingredient">
          + Aggiungi ingrediente
        </button>
      </div>

      <div class="field full">
        <label for="instructions" data-i18n="instructions">Preparazione</label>
        <textarea
          id="instructions"
          placeholder="1. Rosola il filetto...&#10;&#10;2. Aggiungi le prugne...&#10;&#10;3. Continua la cottura..."
        ></textarea>
      </div>

    </div>

    <div class="actions">
      <a href="index.html">
        <button type="button" data-i18n="cancel">Annulla</button>
      </a>

      <button type="submit" class="save" data-i18n="save">Salva ricetta</button>
    </div>

  </form>

</main>
<script>
  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.querySelector("form");

  const translations = {
    it: {
      back: "← Ricette",
      pageTitle: "Aggiungi ricetta",
      title: "Titolo",
      category: "Categoria",
      servings: "Porzioni",
      time: "Tempo",
      madeBy: "Fatto da",
      image: "Immagine",
      ingredients: "Ingredienti",
      instructions: "Preparazione",
      cancel: "Annulla",
      save: "Salva ricetta",

      ingredient: "Ingrediente",
      addIngredient: "+ Aggiungi ingrediente",

      categoryFirst: "Primi",
      categorySecond: "Secondi",
      categorySides: "Contorni",
      categoryDesserts: "Dolci",
      categoryOther: "Altro",

      unitPiece: "pz",
      unitTablespoon: "cucchiaio",
      unitTeaspoon: "cucchiaino",
      unitToTaste: "q.b.",

      titleRequired: "Inserisci il titolo della ricetta.",
      saved: "Ricetta salvata!",
      error: "Errore"
    },

    en: {
      back: "← Recipes",
      pageTitle: "Add recipe",
      title: "Title",
      category: "Category",
      servings: "Servings",
      time: "Time",
      madeBy: "Made by",
      image: "Image",
      ingredients: "Ingredients",
      instructions: "Instructions",
      cancel: "Cancel",
      save: "Save recipe",

      ingredient: "Ingredient",
      addIngredient: "+ Add ingredient",

      categoryFirst: "First courses",
      categorySecond: "Main courses",
      categorySides: "Side dishes",
      categoryDesserts: "Desserts",
      categoryOther: "Other",

      unitPiece: "pcs",
      unitTablespoon: "tbsp",
      unitTeaspoon: "tsp",
      unitToTaste: "to taste",

      titleRequired: "Enter the recipe title.",
      saved: "Recipe saved!",
      error: "Error"
    }
  };

  function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");

    if (urlLang === "it" || urlLang === "en") {
      localStorage.setItem("language", urlLang);
      return urlLang;
    }

    return localStorage.getItem("language") || "it";
  }

  function setLanguage(lang) {
    localStorage.setItem("language", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.dataset.i18n;

      if (translations[lang][key]) {
        element.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );
    });

    const addButton = document.getElementById("add-ingredient");

    if (addButton) {
      addButton.textContent =
        translations[lang].addIngredient;
    }

    const categorySelect =
      document.getElementById("category");

    if (categorySelect) {
      const first =
        categorySelect.querySelector('[value="first"]');

      const second =
        categorySelect.querySelector('[value="second"]');

      const sides =
        categorySelect.querySelector('[value="sides"]');

      const desserts =
        categorySelect.querySelector('[value="desserts"]');

      const other =
        categorySelect.querySelector('[value="other"]');

      if (first) {
        first.textContent =
          translations[lang].categoryFirst;
      }

      if (second) {
        second.textContent =
          translations[lang].categorySecond;
      }

      if (sides) {
        sides.textContent =
          translations[lang].categorySides;
      }

      if (desserts) {
        desserts.textContent =
          translations[lang].categoryDesserts;
      }

      if (other) {
        other.textContent =
          translations[lang].categoryOther;
      }
    }
  }

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.addEventListener("click", () => {
      const lang = button.dataset.lang;

      const params =
        new URLSearchParams(window.location.search);

      params.set("lang", lang);

      window.location.search =
        params.toString();
    });
  });

  const currentLanguage = getLanguage();
  setLanguage(currentLanguage);

  const ingredientsList =
    document.getElementById("ingredients-list");

  const addIngredientButton =
    document.getElementById("add-ingredient");

  function addIngredientRow() {
    const row =
      document.createElement("div");

    row.className = "ingredient-row";

    row.innerHTML = `
      <input
        type="text"
        class="ingredient-name"
        placeholder="${translations[currentLanguage].ingredient}"
      >

      <input
        type="number"
        class="ingredient-quantity"
        step="any"
        min="0"
        placeholder="0"
      >

      <select class="ingredient-unit">
        <option value="g">g</option>
        <option value="kg">kg</option>
        <option value="ml">ml</option>
        <option value="l">l</option>
        <option value="pcs">
          ${translations[currentLanguage].unitPiece}
        </option>
        <option value="tbsp">
          ${translations[currentLanguage].unitTablespoon}
        </option>
        <option value="tsp">
          ${translations[currentLanguage].unitTeaspoon}
        </option>
        <option value="to_taste">
          ${translations[currentLanguage].unitToTaste}
        </option>
      </select>

      <button
        type="button"
        class="remove-ingredient">
        ×
      </button>
    `;

    row
      .querySelector(".remove-ingredient")
      .addEventListener("click", () => {
        row.remove();
      });

    ingredientsList.appendChild(row);
  }

  addIngredientButton.addEventListener(
    "click",
    addIngredientRow
  );

  addIngredientRow();

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const servings =
      document.getElementById("servings").value;

    const time =
      document.getElementById("time").value.trim();

    const madeBy =
      document.getElementById("made_by").value.trim();

    const instructions =
      document.getElementById("instructions").value.trim();

    const imageFile =
      document.getElementById("image").files[0];

    const ingredientRows =
      document.querySelectorAll(".ingredient-row");

    const ingredients = [];

    ingredientRows.forEach(row => {
      const name =
        row
          .querySelector(".ingredient-name")
          .value
          .trim();

      const quantityValue =
        row
          .querySelector(".ingredient-quantity")
          .value;

      const unit =
        row
          .querySelector(".ingredient-unit")
          .value;

      if (name) {
        ingredients.push({
          name: name,
          quantity:
            quantityValue !== ""
              ? Number(quantityValue)
              : null,
          unit: unit
        });
      }
    });

    if (!title) {
      alert(
        translations[currentLanguage].titleRequired
      );

      return;
    }

    try {
      let imageUrl = null;

      if (imageFile) {
        const fileExtension =
          imageFile.name.split(".").pop();

        const fileName =
          crypto.randomUUID() +
          "." +
          fileExtension;

        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("recipe-images")
            .upload(fileName, imageFile);

        if (uploadError) {
          throw uploadError;
        }

        const { data: publicUrlData } =
          supabaseClient
            .storage
            .from("recipe-images")
            .getPublicUrl(fileName);

        imageUrl =
          publicUrlData.publicUrl;
      }

      const recipeData = {
        category: category,
        servings:
          servings
            ? Number(servings)
            : null,
        time: time || null,
        made_by: madeBy || null,
        image_url: imageUrl
      };

      if (currentLanguage === "en") {
        recipeData.title_en =
          title;

        recipeData.instructions_en =
          instructions || null;

      } else {
        recipeData.title =
          title;

        recipeData.instructions =
          instructions || null;
      }

      const {
        data: newRecipe,
        error: insertError
      } =
        await supabaseClient
          .from("recipes")
          .insert(recipeData)
          .select("id")
          .single();

      if (insertError) {
        throw insertError;
      }

      if (ingredients.length > 0) {
        const ingredientData =
          ingredients.map(ingredient => {
            const data = {
              recipe_id:
                newRecipe.id,

              quantity:
                ingredient.quantity,

              unit:
                ingredient.unit || null
            };

            if (currentLanguage === "en") {
              data.name_en =
                ingredient.name;
            } else {
              data.name =
                ingredient.name;
            }

            return data;
          });

        const {
          error: ingredientsError
        } =
          await supabaseClient
            .from("recipe_ingredients")
            .insert(ingredientData);

        if (ingredientsError) {
          throw ingredientsError;
        }
      }

      alert(
        translations[currentLanguage].saved
      );

      window.location.href =
        `index.html?lang=${currentLanguage}`;

    } catch (error) {
      console.error(error);

      alert(
        translations[currentLanguage].error +
        ": " +
        error.message
      );
    }
  });
</script>
</body>
</html>
