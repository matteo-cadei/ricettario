<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifica ricetta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
    }

    .back {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 130px;
      line-height: 1.5;
    }

    #ingredients {
      min-height: 180px;
    }

    #instructions {
      min-height: 220px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .save {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 22px 16px 50px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="back">← Ricette</a>
</header>

<main>

  <h1>Modifica ricetta</h1>

  <form>

    <div class="form-grid">

      <div class="field full">
        <label for="title">Titolo</label>
        <input id="title" type="text" placeholder="Es. Maiale alle prugne">
      </div>

      <div class="field">
        <label for="category">Categoria</label>
        <select id="category">
          <option>Primi</option>
          <option>Secondi</option>
          <option>Contorni</option>
          <option>Dolci</option>
          <option>Altro</option>
        </select>
      </div>

      <div class="field">
        <label for="servings">Porzioni</label>
        <input id="servings" type="number" min="1" placeholder="4">
      </div>

      <div class="field">
        <label for="time">Tempo</label>
        <input id="time" type="text" placeholder="45 min">
      </div>

      <div class="field">
        <label for="made_by">Fatto da</label>
        <input id="made_by" type="text" placeholder="Es. Matteo">
      </div>

      <div class="field">
        <label for="image">Immagine</label>
        <input id="image" type="file" accept="image/*">
      </div>

      <div class="field full">
        <label for="ingredients">Ingredienti</label>
        <textarea
          id="ingredients"
          placeholder="600 g filetto di maiale&#10;6 prugne&#10;1 cucchiaio di miele&#10;..."
        ></textarea>
      </div>

      <div class="field full">
        <label for="instructions">Preparazione</label>
        <textarea
          id="instructions"
          placeholder="1. Rosola il filetto...&#10;&#10;2. Aggiungi le prugne...&#10;&#10;3. Continua la cottura..."
        ></textarea>
      </div>

    </div>

    <div class="actions">
      <a href="index.html">
        <button type="button">Annulla</button>
      </a>

      <button type="submit" class="save">Salva modifiche</button>
    </div>

  </form>

</main>
  
<script>
  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.querySelector("form");

  const params = new URLSearchParams(window.location.search);
  const recipeId = params.get("id");

  let currentImageUrl = null;

  async function loadRecipe() {
    if (!recipeId) {
      alert("ID ricetta mancante.");
      window.location.href = "index.html";
      return;
    }

    const { data: recipe, error } = await supabaseClient
      .from("recipes")
      .select("*")
      .eq("id", recipeId)
      .single();

    if (error || !recipe) {
      console.error(error);
      alert("Errore nel caricamento della ricetta.");
      return;
    }

    document.getElementById("title").value = recipe.title || "";
    document.getElementById("category").value = recipe.category || "Altro";
    document.getElementById("servings").value = recipe.servings || "";
    document.getElementById("time").value = recipe.time || "";
    document.getElementById("made_by").value = recipe.made_by || "";
    document.getElementById("ingredients").value = recipe.ingredients || "";
    document.getElementById("instructions").value = recipe.instructions || "";

    currentImageUrl = recipe.image_url || null;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const servings = document.getElementById("servings").value;
    const time = document.getElementById("time").value.trim();
    const madeBy = document.getElementById("made_by").value.trim();
    const ingredients = document.getElementById("ingredients").value.trim();
    const instructions = document.getElementById("instructions").value.trim();
    const imageFile = document.getElementById("image").files[0];

    if (!title) {
      alert("Inserisci il titolo della ricetta.");
      return;
    }

    try {
      let imageUrl = currentImageUrl;

      if (imageFile) {
        const fileExtension = imageFile.name.split(".").pop();
        const fileName = crypto.randomUUID() + "." + fileExtension;

        const { error: uploadError } = await supabaseClient
          .storage
          .from("recipe-images")
          .upload(fileName, imageFile);

        if (uploadError) {
          throw uploadError;
        }

        const { data: publicUrlData } = supabaseClient
          .storage
          .from("recipe-images")
          .getPublicUrl(fileName);

        imageUrl = publicUrlData.publicUrl;
      }

      const { error: updateError } = await supabaseClient
        .from("recipes")
        .update({
          title: title,
          category: category,
          servings: servings ? Number(servings) : null,
          time: time || null,
          made_by: madeBy || null,
          ingredients: ingredients || null,
          instructions: instructions || null,
          image_url: imageUrl
        })
        .eq("id", recipeId);

      if (updateError) {
        throw updateError;
      }

      alert("Modifiche salvate!");
      window.location.href = `recipe.html?id=${recipeId}`;

    } catch (error) {
      console.error(error);
      alert("Errore: " + error.message);
    }
  });

  loadRecipe();
</script>
</body>
</html>
