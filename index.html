<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricettario</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: #f7f6f2;
      border-bottom: 1px solid #dedbd3;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      background: white;
      border: 1px solid #d9d6cf;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-button {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    main {
      padding: 20px 24px 40px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
    }

    .category {
      white-space: nowrap;
      background: transparent;
    }

    .category.active {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .recipe-card {
      cursor: pointer;
    }

    .recipe-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #dedbd3;
    }

    .recipe-title {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
    }

    @media (max-width: 900px) {
      .recipe-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 16px;
      }

      main {
        padding: 16px;
      }

      .recipe-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .recipe-title {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Ricettario</div>

    <div class="header-actions">
      <button>⌕</button>
      <button class="add-button">＋</button>
    </div>
  </header>

  <main>

    <div class="categories">
      <button class="category active">Tutte</button>
      <button class="category">Primi</button>
      <button class="category">Secondi</button>
      <button class="category">Contorni</button>
      <button class="category">Dolci</button>
    </div>

    <div class="recipe-grid">

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1551183053-bf91a1d81141" alt="Pasta">
        <div class="recipe-title">Pasta con melanzane e feta</div>
      </div>

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1547592180-85f173990554" alt="Carne">
        <div class="recipe-title">Maiale alle prugne</div>
      </div>

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1565958011703-44f9829ba187" alt="Torta">
        <div class="recipe-title">Tarte tatin di barbabietola</div>
      </div>

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1601050690597-df0568f70950" alt="Curry">
        <div class="recipe-title">Curry di verdure</div>
      </div>

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" alt="Pizza">
        <div class="recipe-title">Pizza fatta in casa</div>
      </div>

      <div class="recipe-card">
        <img class="recipe-image" src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601" alt="Risotto">
        <div class="recipe-title">Risotto ai funghi</div>
      </div>

    </div>

  </main>

</body>
</html>
