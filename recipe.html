<!DOCTYPE html>
<html lang="it">
<script defer src="https://umami-omega-ochre-70.vercel.app/script.js" data-website-id="4356a40f-3a0d-4917-aaaf-c462703ec9fa"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Tavola">

  <link rel="manifest" href="manifest.json">

  <title>Ricetta</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
    }

    .back {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .language {
      font-size: 13px;
    }
    .language-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
     }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }
    
    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .edit-link {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    .meta {
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }

    .recipe-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .recipe-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      background: #dedbd3;
    }

    h2 {
      font-size: 14px;
      letter-spacing: 1px;
      margin: 0 0 14px;
    }

    .ingredients {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ingredients li {
      padding: 8px 0;
      border-bottom: 1px solid #dedbd3;
      font-size: 15px;
    }

    .preparation {
      margin-top: 40px;
    }

    .step {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .step-number {
      font-weight: bold;
      color: #888;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    .error {
      color: #8b2e2e;
    }

    @media (max-width: 650px) {

      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 22px 16px 50px;
      }

      h1 {
        font-size: 25px;
      }

      .recipe-top {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .preparation {
        margin-top: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="back" href="index.html">← Ricette</a>

  <div class="header-actions">
    <a id="edit-link" class="edit-link" href="#">Modifica</a>
    <div class="language-switch">
      <button class="lang-btn" data-lang="it">IT</button>
      <span>|</span>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="recipe-container">

  <div class="loading">Caricamento ricetta...</div>

</main>


<script>

  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const translations = {
    it: {
      back: "← Ricette",
      edit: "Modifica",
      ingredients: "INGREDIENTI",
      instructions: "PREPARAZIONE",
      people: "persone",
      madeBy: "Fatto da"
    },
  
    en: {
      back: "← Recipes",
      edit: "Edit",
      ingredients: "INGREDIENTS",
      instructions: "INSTRUCTIONS",
      people: "people",
      madeBy: "Made by"
    }
  };
  
  function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");
  
    if (urlLang === "it" || urlLang === "en") {
      localStorage.setItem("language", urlLang);
      return urlLang;
    }
  
    return localStorage.getItem("language") || "it";
  }
  
  function setLanguage(lang) {
    localStorage.setItem("language", lang);
    document.documentElement.lang = lang;
  
    document.querySelector(".back").textContent =
      translations[lang].back;
  
    document.getElementById("edit-link").textContent =
      translations[lang].edit;
  
    document.querySelectorAll(".lang-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );
    });
  }
  
  document.querySelectorAll(".lang-btn").forEach(button => {
    button.addEventListener("click", () => {
      const lang = button.dataset.lang;
  
      const params = new URLSearchParams(window.location.search);
      params.set("lang", lang);
  
      window.location.search = params.toString();
    });
  });
  
  const currentLanguage = getLanguage();
  setLanguage(currentLanguage);
  
  async function loadRecipe() {

    const container = document.getElementById("recipe-container");

    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    document.getElementById("edit-link").href =
      `edit.html?id=${recipeId}`;

    if (!recipeId) {

      container.innerHTML = `
        <p class="error">Ricetta non trovata.</p>
      `;

      return;
    }


    const { data: recipe, error } = await supabaseClient
      .from("recipes")
      .select("*")
      .eq("id", recipeId)
      .single();


    if (error || !recipe) {

      console.error(error);

      container.innerHTML = `
        <p class="error">Errore nel caricamento della ricetta.</p>
      `;

      return;
    }

    const {
      data: ingredientRows,
      error: ingredientsError
    } = await supabaseClient
      .from("recipe_ingredients")
      .select("*")
      .eq("recipe_id", recipeId)
      .order("id", { ascending: true });
    
    if (ingredientsError) {
      console.error(ingredientsError);
    }

    const displayTitle =
      currentLanguage === "en" && recipe.title_en
        ? recipe.title_en
        : recipe.title;

    const displayIngredients =
      currentLanguage === "en" && recipe.ingredients_en
        ? recipe.ingredients_en
        : recipe.ingredients;
    
    const displayInstructions =
      currentLanguage === "en" && recipe.instructions_en
        ? recipe.instructions_en
        : recipe.instructions;


    document.title = displayTitle;


    const ingredients = (ingredientRows || []).map(ingredient => {
      const name =
        currentLanguage === "en"
          ? (ingredient.name_en || ingredient.name || "")
          : (ingredient.name || ingredient.name_en || "");
    
      const unitLabels = {
        it: {
          pcs: "pz",
          tbsp: "cucchiaio",
          tsp: "cucchiaino",
          to_taste: "q.b."
        },
    
        en: {
          pcs: "pcs",
          tbsp: "tbsp",
          tsp: "tsp",
          to_taste: "to taste"
        }
      };
    
      const quantity =
        ingredient.quantity !== null
          ? ingredient.quantity
          : "";
    
      const unit =
        ingredient.unit
          ? (unitLabels[currentLanguage][ingredient.unit] || ingredient.unit)
          : "";
    
      return {
        name,
        quantity,
        unit
      };
    });


    const instructions = displayInstructions
      ? displayInstructions
          .split("\n")
          .filter(item => item.trim() !== "")
      : [];


    let meta = [];

    if (recipe.time) {
      meta.push(recipe.time);
    }

    if (recipe.servings) {
      meta.push(
        recipe.servings + " " + translations[currentLanguage].people
      );
    }

    if (recipe.made_by) {
      meta.push(
        translations[currentLanguage].madeBy + " " + recipe.made_by
      );
    }

    if (recipe.created_at) {
      const createdDate = new Date(recipe.created_at);

      const formattedDate = createdDate.toLocaleDateString("it-CH", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

        meta.push(formattedDate);
      }

    const imageHTML = recipe.image_url
      ? `
        <img
          class="recipe-image"
          src="${recipe.image_url}"
          alt="${displayTitle}"
        >
      `
      : `
        <div class="recipe-image"></div>
      `;


    container.innerHTML = `

      <h1>${displayTitle}</h1>

      <div class="meta">
        ${meta.join(" · ")}
      </div>


      <div class="recipe-top">

        ${imageHTML}

        <div>

          <h2>${translations[currentLanguage].ingredients}</h2>

          <ul class="ingredients">

            ${ingredients.map(item => `
              <li>
                ${item.quantity ? item.quantity + " " : ""}
                ${item.unit ? item.unit + " " : ""}
                ${item.name}
              </li>
            `).join("")}

          </ul>

        </div>

      </div>


      <div class="preparation">

        <h2>${translations[currentLanguage].instructions}</h2>

        ${instructions.map((step, index) => `

          <div class="step">

            <div class="step-number">
              ${index + 1}
            </div>

            <div>
              ${step.replace(/^\d+[\.\)]\s*/, "")}
            </div>

          </div>

        `).join("")}

      </div>

    `;

  }


  loadRecipe();

</script>

</body>
</html>
