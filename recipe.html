<!DOCTYPE html>
<html lang="it">
<script defer src="https://umami-omega-ochre-70.vercel.app/script.js" data-website-id="4356a40f-3a0d-4917-aaaf-c462703ec9fa"></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ricetta</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
    }

    .back {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .language {
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .edit-link {
      color: #1f1f1f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    .meta {
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }

    .recipe-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .recipe-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      background: #dedbd3;
    }

    h2 {
      font-size: 14px;
      letter-spacing: 1px;
      margin: 0 0 14px;
    }

    .ingredients {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ingredients li {
      padding: 8px 0;
      border-bottom: 1px solid #dedbd3;
      font-size: 15px;
    }

    .preparation {
      margin-top: 40px;
    }

    .step {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 10px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .step-number {
      font-weight: bold;
      color: #888;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }

    .error {
      color: #8b2e2e;
    }

    @media (max-width: 650px) {

      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 22px 16px 50px;
      }

      h1 {
        font-size: 25px;
      }

      .recipe-top {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .preparation {
        margin-top: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="back" href="index.html">← Ricette</a>

  <div class="header-actions">
    <a id="edit-link" class="edit-link" href="#">Modifica</a>
    <div class="language">IT &nbsp;|&nbsp; EN</div>
  </div>
</header>

<main id="recipe-container">

  <div class="loading">Caricamento ricetta...</div>

</main>


<script>

  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  async function loadRecipe() {

    const container = document.getElementById("recipe-container");

    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    document.getElementById("edit-link").href =
      `edit.html?id=${recipeId}`;

    if (!recipeId) {

      container.innerHTML = `
        <p class="error">Ricetta non trovata.</p>
      `;

      return;
    }


    const { data: recipe, error } = await supabaseClient
      .from("recipes")
      .select("*")
      .eq("id", recipeId)
      .single();


    if (error || !recipe) {

      console.error(error);

      container.innerHTML = `
        <p class="error">Errore nel caricamento della ricetta.</p>
      `;

      return;
    }


    document.title = recipe.title;


    const ingredients = recipe.ingredients
      ? recipe.ingredients
          .split("\n")
          .filter(item => item.trim() !== "")
      : [];


    const instructions = recipe.instructions
      ? recipe.instructions
          .split("\n")
          .filter(item => item.trim() !== "")
      : [];


    let meta = [];

    if (recipe.time) {
      meta.push(recipe.time);
    }

    if (recipe.servings) {
      meta.push(recipe.servings + " persone");
    }

    if (recipe.made_by) {
      meta.push("Fatto da " + recipe.made_by);
    }

    if (recipe.created_at) {
      const createdDate = new Date(recipe.created_at);

      const formattedDate = createdDate.toLocaleDateString("it-CH", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

        meta.push(formattedDate);
      }

    const imageHTML = recipe.image_url
      ? `
        <img
          class="recipe-image"
          src="${recipe.image_url}"
          alt="${recipe.title}"
        >
      `
      : `
        <div class="recipe-image"></div>
      `;


    container.innerHTML = `

      <h1>${recipe.title}</h1>

      <div class="meta">
        ${meta.join(" · ")}
      </div>


      <div class="recipe-top">

        ${imageHTML}

        <div>

          <h2>INGREDIENTI</h2>

          <ul class="ingredients">

            ${ingredients.map(item => `
              <li>${item}</li>
            `).join("")}

          </ul>

        </div>

      </div>


      <div class="preparation">

        <h2>PREPARAZIONE</h2>

        ${instructions.map((step, index) => `

          <div class="step">

            <div class="step-number">
              ${index + 1}
            </div>

            <div>
              ${step.replace(/^\d+[\.\)]\s*/, "")}
            </div>

          </div>

        `).join("")}

      </div>

    `;

  }


  loadRecipe();

</script>

</body>
</html>
