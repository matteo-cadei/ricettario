<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Tavola">

  <link rel="manifest" href="manifest.json">

  <title>A Tavola — Calendario</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .back {
      justify-self: start;
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .logo {
      justify-self: center;
      font-size: 20px;
      font-weight: 700;
    }

    .language-switch {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }

    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .calendar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .week-navigation {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .week-title {
      font-size: 22px;
      font-weight: 700;
    }

    button {
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .export-button {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .meal-grid {
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      border-top: 1px solid #dedbd3;
      border-left: 1px solid #dedbd3;
    }

    .cell {
      min-width: 0;
      min-height: 64px;
      padding: 10px 12px;
      border-right: 1px solid #dedbd3;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .cell.header-cell {
      min-height: auto;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .day-cell {
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .meal-cell {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .meal-cell:hover {
      background: #efede7;
    }

    .meal-name {
      font-size: 14px;
      font-weight: 600;
    }

    .empty {
      color: #aaa;
      font-size: 14px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      width: 100%;
      max-width: 420px;
      max-height: 70vh;
      overflow-y: auto;
      background: #f7f6f2;
      border-radius: 12px;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    #close-modal {
      border: none;
      background: transparent;
      font-size: 22px;
      padding: 4px 8px;
    }

    .custom-meal {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .custom-meal input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dedbd3;
      border-radius: 8px;
      padding: 10px 12px;
      background: white;
      font: inherit;
    }

    .recipe-section-title {
      margin: 14px 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .recipe-choice {
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid #dedbd3;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .recipe-choice:hover {
      background: #efede7;
    }

    .remove-meal {
      margin-top: 14px;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 20px 12px 40px;
      }

      .week-title {
        font-size: 18px;
      }

      .calendar-top {
        align-items: flex-start;
      }

      .meal-grid {
        grid-template-columns: 64px 1fr 1fr;
      }

      .cell {
        padding: 9px 8px;
        min-height: 58px;
      }

      .meal-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="back" href="index.html" data-i18n="back">← Ricette</a>

  <div class="logo" data-i18n="logo">A Tavola</div>

  <div class="language-switch">
    <button class="lang-btn" data-lang="it">IT</button>
    <span>|</span>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main>

  <div class="calendar-top">

    <div class="week-navigation">
      <button type="button" id="prev-week">←</button>
      <div class="week-title" id="week-title"></div>
      <button type="button" id="next-week">→</button>
    </div>

    <button
      type="button"
      class="export-button"
      data-i18n="export">
      Esporta
    </button>

  </div>

  <div class="meal-grid" id="meal-grid"></div>

</main>

<div id="recipe-modal" class="modal hidden">
  <div class="modal-content">

    <div class="modal-header">
      <strong id="modal-title">Scegli un pasto</strong>
      <button type="button" id="close-modal">×</button>
    </div>

    <div id="recipe-list" class="recipe-list"></div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let selectedDate = null;
  let selectedMeal = null;
  let currentWeek = new Date();

  const translations = {
    it: {
      logo: "A Tavola",
      back: "← Ricette",
      lunch: "Pranzo",
      dinner: "Cena",
      export: "Esporta",
      chooseRecipe: "Scegli un pasto",
      customPlaceholder: "Scrivi un pasto...",
      addCustom: "Aggiungi",
      myRecipes: "Le mie ricette",
      removeMeal: "Rimuovi pasto",
      loading: "Caricamento...",
      loadError: "Errore nel caricamento.",
      saveError: "Errore nel salvataggio.",
      mon: "Lun",
      tue: "Mar",
      wed: "Mer",
      thu: "Gio",
      fri: "Ven",
      sat: "Sab",
      sun: "Dom"
    },

    en: {
      logo: "Our Table",
      back: "← Recipes",
      lunch: "Lunch",
      dinner: "Dinner",
      export: "Export",
      chooseRecipe: "Choose a meal",
      customPlaceholder: "Write a meal...",
      addCustom: "Add",
      myRecipes: "My recipes",
      removeMeal: "Remove meal",
      loading: "Loading...",
      loadError: "Error loading recipes.",
      saveError: "Error saving meal.",
      mon: "Mon",
      tue: "Tue",
      wed: "Wed",
      thu: "Thu",
      fri: "Fri",
      sat: "Sat",
      sun: "Sun"
    }
  };

  function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");

    if (urlLang === "it" || urlLang === "en") {
      localStorage.setItem("language", urlLang);
      return urlLang;
    }

    return localStorage.getItem("language") || "it";
  }

  function setLanguage(lang) {
    localStorage.setItem("language", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.dataset.i18n;

      if (translations[lang][key]) {
        element.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );
    });
  }

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.addEventListener("click", () => {
      const lang = button.dataset.lang;

      const params = new URLSearchParams(window.location.search);
      params.set("lang", lang);

      window.location.search = params.toString();
    });
  });

  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay();

    const difference =
      d.getDate() - day + (day === 0 ? -6 : 1);

    d.setDate(difference);
    d.setHours(0, 0, 0, 0);

    return d;
  }

  function formatISO(date) {
    const year = date.getFullYear();
    const month =
      String(date.getMonth() + 1).padStart(2, "0");
    const day =
      String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function formatWeek() {
    const monday = getMonday(currentWeek);

    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const locale =
      currentLanguage === "en" ? "en-GB" : "it-IT";

    const startDay = monday.getDate();
    const endDay = sunday.getDate();

    const startMonth =
      monday.toLocaleDateString(locale, {
        month: "long"
      });

    const endMonth =
      sunday.toLocaleDateString(locale, {
        month: "long"
      });

    let weekText;

    if (
      monday.getMonth() === sunday.getMonth() &&
      monday.getFullYear() === sunday.getFullYear()
    ) {
      weekText = `${startDay}–${endDay} ${endMonth}`;
    } else {
      weekText = `${startDay} ${startMonth} – ${endDay} ${endMonth}`;
    }

    if (monday.getFullYear() !== sunday.getFullYear()) {
      weekText =
        `${startDay} ${startMonth} ${monday.getFullYear()} – ` +
        `${endDay} ${endMonth} ${sunday.getFullYear()}`;
    }

    document.getElementById("week-title").textContent =
      weekText;
  }

  function renderCalendar() {
    const grid = document.getElementById("meal-grid");
    const monday = getMonday(currentWeek);

    const dayKeys = [
      "mon",
      "tue",
      "wed",
      "thu",
      "fri",
      "sat",
      "sun"
    ];

    let html = `
      <div class="cell header-cell"></div>

      <div class="cell header-cell">
        ${translations[currentLanguage].lunch}
      </div>

      <div class="cell header-cell">
        ${translations[currentLanguage].dinner}
      </div>
    `;

    for (let i = 0; i < 7; i++) {
      const date = new Date(monday);
      date.setDate(monday.getDate() + i);

      const isoDate = formatISO(date);

      html += `
        <div class="cell day-cell">
          ${translations[currentLanguage][dayKeys[i]]}
          ${date.getDate()}
        </div>

        <div
          class="cell meal-cell"
          data-date="${isoDate}"
          data-meal="lunch">
          <span class="empty">＋</span>
        </div>

        <div
          class="cell meal-cell"
          data-date="${isoDate}"
          data-meal="dinner">
          <span class="empty">＋</span>
        </div>
      `;
    }

    grid.innerHTML = html;

    document
      .querySelectorAll(".meal-cell")
      .forEach(cell => {
        cell.addEventListener("click", () => {
          openRecipeModal(
            cell.dataset.date,
            cell.dataset.meal
          );
        });
      });
  }

  async function openRecipeModal(date, meal) {
    selectedDate = date;
    selectedMeal = meal;

    const modal = document.getElementById("recipe-modal");
    const list = document.getElementById("recipe-list");
    const title = document.getElementById("modal-title");

    title.textContent =
      translations[currentLanguage].chooseRecipe;

    modal.classList.remove("hidden");

    list.innerHTML =
      translations[currentLanguage].loading;

    const { data: recipes, error } =
      await supabaseClient
        .from("recipes")
        .select("id, title, title_en")
        .order("title", { ascending: true });

    if (error) {
      console.error(error);

      list.innerHTML =
        translations[currentLanguage].loadError;

      return;
    }

    const recipeButtons =
      recipes.map(recipe => {
        const displayTitle =
          currentLanguage === "en" && recipe.title_en
            ? recipe.title_en
            : recipe.title;

        return `
          <button
            type="button"
            class="recipe-choice"
            data-id="${recipe.id}">
            ${displayTitle || "—"}
          </button>
        `;
      }).join("");

    list.innerHTML = `
      <div class="custom-meal">
        <input
          type="text"
          id="custom-meal-input"
          placeholder="${translations[currentLanguage].customPlaceholder}"
        >

        <button type="button" id="save-custom-meal">
          ${translations[currentLanguage].addCustom}
        </button>
      </div>

      <div class="recipe-section-title">
        ${translations[currentLanguage].myRecipes}
      </div>

      ${recipeButtons}

      <button
        type="button"
        class="recipe-choice remove-meal"
        id="remove-meal">
        ${translations[currentLanguage].removeMeal}
      </button>
    `;

    document
      .querySelectorAll(".recipe-choice[data-id]")
      .forEach(button => {
        button.addEventListener("click", () => {
          saveMeal(button.dataset.id);
        });
      });

    document
      .getElementById("save-custom-meal")
      .addEventListener("click", () => {
        const text =
          document
            .getElementById("custom-meal-input")
            .value
            .trim();

        if (text) {
          saveCustomMeal(text);
        }
      });

    document
      .getElementById("custom-meal-input")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") {
          const text = event.target.value.trim();

          if (text) {
            saveCustomMeal(text);
          }
        }
      });

    document
      .getElementById("remove-meal")
      .addEventListener("click", removeMeal);
  }

  async function saveMeal(recipeId) {
    const { data: existing, error: findError } =
      await supabaseClient
        .from("meal_plan")
        .select("id")
        .eq("date", selectedDate)
        .eq("meal_type", selectedMeal)
        .maybeSingle();

    if (findError) {
      console.error(findError);
      alert(translations[currentLanguage].saveError);
      return;
    }

    let error;

    if (existing) {
      const result =
        await supabaseClient
          .from("meal_plan")
          .update({
            recipe_id: Number(recipeId),
            custom_text: null
          })
          .eq("id", existing.id);

      error = result.error;

    } else {
      const result =
        await supabaseClient
          .from("meal_plan")
          .insert({
            date: selectedDate,
            meal_type: selectedMeal,
            recipe_id: Number(recipeId),
            custom_text: null
          });

      error = result.error;
    }

    if (error) {
      console.error(error);
      alert(translations[currentLanguage].saveError);
      return;
    }

    document
      .getElementById("recipe-modal")
      .classList.add("hidden");

    renderCalendar();
    await loadMealPlan();
  }

  async function saveCustomMeal(text) {
    const { data: existing, error: findError } =
      await supabaseClient
        .from("meal_plan")
        .select("id")
        .eq("date", selectedDate)
        .eq("meal_type", selectedMeal)
        .maybeSingle();

    if (findError) {
      console.error(findError);
      alert(translations[currentLanguage].saveError);
      return;
    }

    let error;

    if (existing) {
      const result =
        await supabaseClient
          .from("meal_plan")
          .update({
            recipe_id: null,
            custom_text: text
          })
          .eq("id", existing.id);

      error = result.error;

    } else {
      const result =
        await supabaseClient
          .from("meal_plan")
          .insert({
            date: selectedDate,
            meal_type: selectedMeal,
            recipe_id: null,
            custom_text: text
          });

      error = result.error;
    }

    if (error) {
      console.error(error);
      alert(translations[currentLanguage].saveError);
      return;
    }

    document
      .getElementById("recipe-modal")
      .classList.add("hidden");

    renderCalendar();
    await loadMealPlan();
  }

  async function removeMeal() {
    const { error } =
      await supabaseClient
        .from("meal_plan")
        .delete()
        .eq("date", selectedDate)
        .eq("meal_type", selectedMeal);

    if (error) {
      console.error(error);
      alert(translations[currentLanguage].saveError);
      return;
    }

    document
      .getElementById("recipe-modal")
      .classList.add("hidden");

    renderCalendar();
    await loadMealPlan();
  }

  async function loadMealPlan() {
    const monday = getMonday(currentWeek);

    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const { data: meals, error } =
      await supabaseClient
        .from("meal_plan")
        .select(`
          date,
          meal_type,
          recipe_id,
          custom_text
        `)
        .gte("date", formatISO(monday))
        .lte("date", formatISO(sunday));

    if (error) {
      console.error(error);
      return;
    }

    if (!meals || meals.length === 0) {
      return;
    }

    const recipeIds =
      [...new Set(
        meals
          .filter(meal => meal.recipe_id !== null)
          .map(meal => meal.recipe_id)
      )];

    let recipes = [];

    if (recipeIds.length > 0) {
      const {
        data,
        error: recipeError
      } =
        await supabaseClient
          .from("recipes")
          .select("id, title, title_en")
          .in("id", recipeIds);

      if (recipeError) {
        console.error(recipeError);
        return;
      }

      recipes = data || [];
    }

    const recipeMap = new Map();

    recipes.forEach(recipe => {
      recipeMap.set(recipe.id, recipe);
    });

    meals.forEach(meal => {
      const cell =
        document.querySelector(
          `.meal-cell[data-date="${meal.date}"][data-meal="${meal.meal_type}"]`
        );

      if (!cell) {
        return;
      }

      if (meal.custom_text) {
        cell.innerHTML = `
          <div class="meal-name">
            ${meal.custom_text}
          </div>
        `;

        return;
      }

      const recipe =
        recipeMap.get(meal.recipe_id);

      if (!recipe) {
        return;
      }

      const displayTitle =
        currentLanguage === "en" && recipe.title_en
          ? recipe.title_en
          : recipe.title;

      cell.innerHTML = `
        <div class="meal-name">
          ${displayTitle || "—"}
        </div>
      `;
    });
  }

  document
    .getElementById("prev-week")
    .addEventListener("click", async () => {
      currentWeek.setDate(
        currentWeek.getDate() - 7
      );

      formatWeek();
      renderCalendar();
      await loadMealPlan();
    });

  document
    .getElementById("next-week")
    .addEventListener("click", async () => {
      currentWeek.setDate(
        currentWeek.getDate() + 7
      );

      formatWeek();
      renderCalendar();
      await loadMealPlan();
    });

  document
    .getElementById("close-modal")
    .addEventListener("click", () => {
      document
        .getElementById("recipe-modal")
        .classList.add("hidden");
    });

  document
    .getElementById("recipe-modal")
    .addEventListener("click", event => {
      if (event.target.id === "recipe-modal") {
        document
          .getElementById("recipe-modal")
          .classList.add("hidden");
      }
    });

  const currentLanguage =
    getLanguage();

  setLanguage(currentLanguage);

  formatWeek();
  renderCalendar();
  loadMealPlan();
</script>

</body>
</html>
