<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Tavola — Calendario</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .back {
      justify-self: start;
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .logo {
      justify-self: center;
      font-size: 20px;
      font-weight: 700;
    }

    .language-switch {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }

    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .calendar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .week-navigation {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .week-title {
      font-size: 22px;
      font-weight: 700;
    }

    button {
      border: 1px solid #d6d2c9;
      background: white;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .export-button {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .meal-grid {
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      border-top: 1px solid #dedbd3;
      border-left: 1px solid #dedbd3;
    }

    .cell {
      min-width: 0;
      min-height: 64px;
      padding: 10px 12px;
      border-right: 1px solid #dedbd3;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .cell.header-cell {
      min-height: auto;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .day-cell {
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .meal-cell {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .meal-cell:hover {
      background: #efede7;
    }

    .meal-name {
      font-size: 14px;
      font-weight: 600;
    }

    .empty {
      color: #aaa;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 20px 12px 40px;
      }

      .week-title {
        font-size: 18px;
      }

      .calendar-top {
        align-items: flex-start;
      }

      .meal-grid {
        grid-template-columns: 64px 1fr 1fr;
      }

      .cell {
        padding: 9px 8px;
        min-height: 58px;
      }

      .meal-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="back" href="index.html" data-i18n="back">← Ricette</a>

  <div class="logo" data-i18n="logo">A Tavola</div>

  <div class="language-switch">
    <button class="lang-btn" data-lang="it">IT</button>
    <span>|</span>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main>

  <div class="calendar-top">

    <div class="week-navigation">
      <button type="button" id="prev-week">←</button>
    
      <div class="week-title" id="week-title"></div>
    
      <button type="button" id="next-week">→</button>
    </div>

    <button
      type="button"
      class="export-button"
      data-i18n="export">
      Esporta
    </button>

  </div>

  <div class="meal-grid">

    <div class="cell header-cell"></div>
    <div class="cell header-cell" data-i18n="lunch">Pranzo</div>
    <div class="cell header-cell" data-i18n="dinner">Cena</div>

    <div class="cell day-cell" data-i18n="mon">Lun</div>
    <div class="cell meal-cell">
      <div class="meal-name">Pasta al pesto</div>
    </div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>

    <div class="cell day-cell" data-i18n="tue">Mar</div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>
    <div class="cell meal-cell">
      <div class="meal-name">Maiale alle prugne</div>
    </div>

    <div class="cell day-cell" data-i18n="wed">Mer</div>
    <div class="cell meal-cell">
      <div class="meal-name">Risotto ai funghi</div>
    </div>
    <div class="cell meal-cell">
      <div class="meal-name">Curry di verdure</div>
    </div>

    <div class="cell day-cell" data-i18n="thu">Gio</div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>

    <div class="cell day-cell" data-i18n="fri">Ven</div>
    <div class="cell meal-cell">
      <div class="meal-name">Pasta alle melanzane</div>
    </div>
    <div class="cell meal-cell">
      <div class="meal-name">Pesce al forno</div>
    </div>

    <div class="cell day-cell" data-i18n="sat">Sab</div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>
    <div class="cell meal-cell">
      <div class="meal-name">Pizza fatta in casa</div>
    </div>

    <div class="cell day-cell" data-i18n="sun">Dom</div>
    <div class="cell meal-cell">
      <div class="meal-name">Lasagne</div>
    </div>
    <div class="cell meal-cell">
      <span class="empty">＋</span>
    </div>

  </div>

</main>

<script>
  const translations = {
    it: {
      logo: "A Tavola",
      back: "← Ricette",
      lunch: "Pranzo",
      dinner: "Cena",
      export: "Esporta",
      mon: "Lun",
      tue: "Mar",
      wed: "Mer",
      thu: "Gio",
      fri: "Ven",
      sat: "Sab",
      sun: "Dom"
    },

    en: {
      logo: "Our Table",
      back: "← Recipes",
      lunch: "Lunch",
      dinner: "Dinner",
      export: "Export",
      mon: "Mon",
      tue: "Tue",
      wed: "Wed",
      thu: "Thu",
      fri: "Fri",
      sat: "Sat",
      sun: "Sun"
    }
  };

  function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");

    if (urlLang === "it" || urlLang === "en") {
      localStorage.setItem("language", urlLang);
      return urlLang;
    }

    return localStorage.getItem("language") || "it";
  }

  function setLanguage(lang) {
    localStorage.setItem("language", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.dataset.i18n;

      if (translations[lang][key]) {
        element.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );
    });
  }

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.addEventListener("click", () => {
      const lang = button.dataset.lang;

      const params = new URLSearchParams(window.location.search);
      params.set("lang", lang);

      window.location.search = params.toString();
    });
  });

  let currentWeek = new Date();

  function getMonday(date) {
    const d = new Date(date);
  
    const day = d.getDay();
  
    const difference =
      d.getDate() - day + (day === 0 ? -6 : 1);
  
    d.setDate(difference);
    d.setHours(0, 0, 0, 0);
  
    return d;
  }
  
  function formatWeek() {
    const monday = getMonday(currentWeek);
  
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
  
    const locale =
      currentLanguage === "en" ? "en-GB" : "it-IT";
  
    const startDay = monday.getDate();
    const endDay = sunday.getDate();
  
    const startMonth = monday.toLocaleDateString(locale, {
      month: "long"
    });
  
    const endMonth = sunday.toLocaleDateString(locale, {
      month: "long"
    });
  
    const year = sunday.getFullYear();
  
    let weekText;
  
    if (
      monday.getMonth() === sunday.getMonth() &&
      monday.getFullYear() === sunday.getFullYear()
    ) {
      weekText =
        `${startDay}–${endDay} ${endMonth}`;
    } else {
      weekText =
        `${startDay} ${startMonth} – ${endDay} ${endMonth}`;
    }
  
    if (monday.getFullYear() !== sunday.getFullYear()) {
      weekText =
        `${startDay} ${startMonth} ${monday.getFullYear()} – ` +
        `${endDay} ${endMonth} ${sunday.getFullYear()}`;
    }
  
    document.getElementById("week-title").textContent =
      weekText;
  }
  
  document
    .getElementById("prev-week")
    .addEventListener("click", () => {
      currentWeek.setDate(currentWeek.getDate() - 7);
      formatWeek();
    });
  
  document
    .getElementById("next-week")
    .addEventListener("click", () => {
      currentWeek.setDate(currentWeek.getDate() + 7);
      formatWeek();
    });

  const currentLanguage = getLanguage();
  setLanguage(currentLanguage);
  
  formatWeek();
</script>

</body>
</html>
