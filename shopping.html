<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Tavola — Lista della spesa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f6f2;
      color: #1f1f1f;
    }

    header {
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #dedbd3;
      background: #f7f6f2;
    }

    .back {
      justify-self: start;
      color: #1f1f1f;
      text-decoration: none;
      font-size: 14px;
    }

    .logo {
      justify-self: center;
      font-size: 20px;
      font-weight: 700;
    }

    .language-switch {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
    }

    .lang-btn.active {
      color: #1f1f1f;
      font-weight: 700;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .week {
      color: #777;
      font-size: 14px;
    }

    .shopping-list {
      border-top: 1px solid #dedbd3;
    }

    .shopping-item {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #dedbd3;
    }

    .shopping-item input {
      width: 16px;
      height: 16px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
    }

    .item-amount {
      font-size: 14px;
      color: #666;
      white-space: nowrap;
    }

    .empty {
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
        padding: 0 16px;
      }

      main {
        padding: 20px 16px 40px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="back" href="calendar.html" data-i18n="back">← Calendario</a>

  <div class="logo" data-i18n="logo">A Tavola</div>

  <div class="language-switch">
    <button class="lang-btn" data-lang="it">IT</button>
    <span>|</span>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main>

  <div class="top">
    <div>
      <h1 data-i18n="title">Lista della spesa</h1>
      <div class="week" id="week-title"></div>
    </div>
  </div>

  <div id="shopping-list" class="shopping-list">
    <div class="empty" data-i18n="loading">Caricamento...</div>
  </div>

</main>

<script>
  const SUPABASE_URL = "https://qhrthaaqsgeyqsnaefhb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4jxAO_hOISps1tGhsoiBXA_EW5azn92";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const translations = {
    it: {
      logo: "A Tavola",
      back: "← Calendario",
      title: "Lista della spesa",
      loading: "Caricamento...",
      empty: "Nessun ingrediente per questa settimana.",
      pcs: "pz",
      tbsp: "cucchiaio",
      tsp: "cucchiaino",
      to_taste: "q.b."
    },

    en: {
      logo: "Our Table",
      back: "← Calendar",
      title: "Shopping list",
      loading: "Loading...",
      empty: "No ingredients for this week.",
      pcs: "pcs",
      tbsp: "tbsp",
      tsp: "tsp",
      to_taste: "to taste"
    }
  };

  function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get("lang");

    if (urlLang === "it" || urlLang === "en") {
      localStorage.setItem("language", urlLang);
      return urlLang;
    }

    return localStorage.getItem("language") || "it";
  }

  const currentLanguage = getLanguage();

  function setLanguage(lang) {
    localStorage.setItem("language", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
      const key = element.dataset.i18n;

      if (translations[lang][key]) {
        element.textContent = translations[lang][key];
      }
    });

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );
    });
  }

  document.querySelectorAll(".lang-btn").forEach(button => {
    button.addEventListener("click", () => {
      const params = new URLSearchParams(window.location.search);
      params.set("lang", button.dataset.lang);
      window.location.search = params.toString();
    });
  });

  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay();

    const difference =
      d.getDate() - day + (day === 0 ? -6 : 1);

    d.setDate(difference);
    d.setHours(0, 0, 0, 0);

    return d;
  }

  function formatISO(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function formatWeek() {
    const monday = getMonday(new Date());
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const locale =
      currentLanguage === "en" ? "en-GB" : "it-IT";

    const startDay = monday.getDate();
    const endDay = sunday.getDate();

    const startMonth = monday.toLocaleDateString(locale, {
      month: "long"
    });

    const endMonth = sunday.toLocaleDateString(locale, {
      month: "long"
    });

    let text;

    if (monday.getMonth() === sunday.getMonth()) {
      text = `${startDay}–${endDay} ${endMonth}`;
    } else {
      text = `${startDay} ${startMonth} – ${endDay} ${endMonth}`;
    }

    document.getElementById("week-title").textContent = text;
  }

  function unitLabel(unit) {
    if (!unit) return "";

    if (translations[currentLanguage][unit]) {
      return translations[currentLanguage][unit];
    }

    return unit;
  }

  async function loadShoppingList() {
    const list = document.getElementById("shopping-list");

    const monday = getMonday(new Date());
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const { data: meals, error: mealError } =
      await supabaseClient
        .from("meal_plan")
        .select("recipe_id")
        .gte("date", formatISO(monday))
        .lte("date", formatISO(sunday))
        .not("recipe_id", "is", null);

    if (mealError) {
      console.error(mealError);
      list.innerHTML = `<div class="empty">Errore</div>`;
      return;
    }

    const recipeIds =
      [...new Set(
        (meals || []).map(meal => meal.recipe_id)
      )];

    if (recipeIds.length === 0) {
      list.innerHTML =
        `<div class="empty">${translations[currentLanguage].empty}</div>`;
      return;
    }

    const { data: ingredients, error: ingredientError } =
      await supabaseClient
        .from("recipe_ingredients")
        .select("*")
        .in("recipe_id", recipeIds);

    if (ingredientError) {
      console.error(ingredientError);
      list.innerHTML = `<div class="empty">Errore</div>`;
      return;
    }

    const grouped = new Map();

    (ingredients || []).forEach(item => {
      const displayName =
        currentLanguage === "en"
          ? (item.name_en || item.name || "")
          : (item.name || item.name_en || "");

      if (!displayName) return;

      const normalizedName =
        displayName.trim().toLowerCase();

      const normalizedUnit =
        item.unit || "";

      const key =
        `${normalizedName}__${normalizedUnit}`;

      if (!grouped.has(key)) {
        grouped.set(key, {
          name: displayName.trim(),
          quantity: 0,
          hasQuantity: false,
          unit: normalizedUnit
        });
      }

      const entry = grouped.get(key);

      if (item.quantity !== null) {
        entry.quantity += Number(item.quantity);
        entry.hasQuantity = true;
      }
    });

    const items =
      [...grouped.values()]
        .sort((a, b) =>
          a.name.localeCompare(
            b.name,
            currentLanguage === "en" ? "en" : "it"
          )
        );

    if (items.length === 0) {
      list.innerHTML =
        `<div class="empty">${translations[currentLanguage].empty}</div>`;
      return;
    }

    list.innerHTML = items.map(item => {
      let amount = "";

      if (item.hasQuantity) {
        amount += item.quantity;
      }

      if (item.unit) {
        amount +=
          `${amount ? " " : ""}${unitLabel(item.unit)}`;
      }

      return `
        <label class="shopping-item">
          <input type="checkbox">

          <span class="item-name">
            ${item.name}
          </span>

          <span class="item-amount">
            ${amount}
          </span>
        </label>
      `;
    }).join("");
  }

  setLanguage(currentLanguage);
  formatWeek();
  loadShoppingList();
</script>

</body>
</html>
